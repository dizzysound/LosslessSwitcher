<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Signal path: Apple Music on its own resamples a 96 kHz track to the device's 48 kHz and mixes in other sounds; with Nativerate's Exclusive Mode the track reaches the DAC unchanged at 96 kHz, and other apps play on the built-in speakers.">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .h { font-size: 15px; font-weight: 600; }
    .s { font-size: 12.5px; fill: #59636e; }
    .row { font-size: 13px; font-weight: 700; letter-spacing: .06em; fill: #59636e; }
    .box { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
    .bad { stroke: #cf222e; stroke-width: 2; }
    .good { stroke: #1a7f64; stroke-width: 2; }
    .badt { fill: #cf222e; }
    .goodt { fill: #1a7f64; }
    .ln { stroke: #8c959f; stroke-width: 2; fill: none; }
    .ah { fill: #8c959f; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .s, .row { fill: #9198a1; }
      .box { fill: #161b22; stroke: #3d444d; }
      .bad { stroke: #f85149; }
      .good { stroke: #5fe3c0; }
      .badt { fill: #f85149; }
      .goodt { fill: #5fe3c0; }
      .ln { stroke: #656c76; }
      .ah { fill: #656c76; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0L10 5L0 10z"/></marker>
  </defs>

  <text class="row" x="20" y="30">APPLE MUSIC ON ITS OWN</text>
  <rect class="box" x="20" y="45" width="180" height="72" rx="10"/>
  <text class="h" x="36" y="75">Apple Music</text>
  <text class="s" x="36" y="97">96 kHz track</text>
  <path class="ln" d="M200 81H244" marker-end="url(#a)"/>
  <rect class="box bad" x="250" y="45" width="330" height="72" rx="10"/>
  <text class="h" x="266" y="75">macOS mixer</text>
  <text class="s" x="266" y="97">resamples to the device rate, mixes in alerts</text>
  <path class="ln" d="M580 81H624" marker-end="url(#a)"/>
  <rect class="box bad" x="630" y="45" width="250" height="72" rx="10"/>
  <text class="h" x="646" y="75">DAC at <tspan class="badt">48 kHz</tspan></text>
  <text class="s" x="646" y="97">whatever Audio MIDI Setup says</text>

  <text class="row" x="20" y="180">WITH NATIVERATE EXCLUSIVE MODE</text>
  <rect class="box" x="20" y="195" width="180" height="72" rx="10"/>
  <text class="h" x="36" y="225">Apple Music</text>
  <text class="s" x="36" y="247">96 kHz track</text>
  <path class="ln" d="M200 231H234" marker-end="url(#a)"/>
  <rect class="box good" x="240" y="195" width="200" height="72" rx="10"/>
  <text class="h" x="256" y="225">Nativerate device</text>
  <text class="s" x="256" y="247">clock follows the DAC</text>
  <path class="ln" d="M440 231H474" marker-end="url(#a)"/>
  <rect class="box good" x="480" y="195" width="180" height="72" rx="10"/>
  <text class="h" x="496" y="225">Engine</text>
  <text class="s" x="496" y="247">samples unchanged</text>
  <path class="ln" d="M660 231H694" marker-end="url(#a)"/>
  <rect class="box good" x="700" y="195" width="180" height="72" rx="10"/>
  <text class="h" x="716" y="225">DAC at <tspan class="goodt">96 kHz</tspan></text>
  <text class="s" x="716" y="247">hogged, integer format</text>

  <rect class="box" x="240" y="315" width="200" height="72" rx="10"/>
  <text class="h" x="256" y="345">Other apps, alerts</text>
  <text class="s" x="256" y="367">never mixed into the DAC</text>
  <path class="ln" d="M440 351H474" marker-end="url(#a)"/>
  <rect class="box" x="480" y="315" width="180" height="72" rx="10"/>
  <text class="h" x="496" y="345">Built-in speakers</text>
  <text class="s" x="496" y="367">or a device you choose</text>
  <text class="s" x="700" y="345">At a rate change, Music pauses,</text>
  <text class="s" x="700" y="363">the DAC switches, the track</text>
  <text class="s" x="700" y="381">rewinds and plays.</text>
</svg>
